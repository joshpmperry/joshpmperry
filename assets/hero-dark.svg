<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-labelledby="t d">
  <!-- Fonts: Newsreader (c) 2020 The Newsreader Project Authors; Hanken Grotesk (c) 2021 The Hanken Grotesk Project Authors. Subsets embedded under the SIL Open Font License 1.1. -->
  <title id="t">Josh Perry</title>
  <desc id="d">Josh Perry. Software engineer, Bangkok. Now: helping shops see their real profit. Side quest: making search less painful. Off the clock: writing music. Always: trusting the process. Usually built with Go, TypeScript, React, Next.js, TanStack, PostgreSQL, Redis, GCP, Docker.</desc>
  <style>
    @font-face { font-family: 'JP Display'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JP Sans'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JP Sans Light'; src: url(data:font/woff2;base64,) format('woff2'); }
    
    .disp { font-family: 'JP Display', serif; fill: #F2F2F0; }
    .caps { font-family: 'JP Sans', sans-serif; fill: #8A8A88; text-transform: uppercase; }
    .body { font-family: 'JP Sans Light', sans-serif; fill: #F2F2F0; }
    .grey { fill: #8A8A88; }
    .rule { stroke: #8A8A88; stroke-opacity: 0.45; stroke-width: 1; }
    .from-left { transform-box: fill-box; transform-origin: left center; }
    .bx { transform-box: fill-box; transform-origin: center; }

    /* Each keyframe names only its starting point: the resting state is the plain, visible one,
       so a renderer that skips CSS animation still shows everything in place. */
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation: rise 1s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .draw { animation: draw 1.1s cubic-bezier(0.77, 0, 0.175, 1) both; }
      .fade { animation: fade 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .lift { animation: lift 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .rise { transform-box: fill-box; }
      /* Constant motion is linear; the pulse is a slow breath, not a blink. */
      .ticker { transform-box: fill-box; animation: ticker 48s linear infinite; }
      .pulse { animation: pulse 2.4s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
      .odo { animation: odo 13s cubic-bezier(0.77, 0, 0.175, 1) 2.2s infinite; }
    }
    @keyframes ticker { to { transform: translateX(-50%); } }
    @keyframes pulse { 50% { opacity: 0.3; } }
    /* Odometer: hold each phrase, then a short eased step up to the next. The last row repeats
       the first, so the jump back to 0 is invisible. At rest it shows the first phrase. */
    @keyframes odo {
      0%, 21% { transform: translateY(0); }
      25%, 46% { transform: translateY(-40px); }
      50%, 71% { transform: translateY(-80px); }
      75%, 96% { transform: translateY(-120px); }
      100% { transform: translateY(-160px); }
    }
    @keyframes rise { from { transform: translateY(105%); } }
    @keyframes draw { from { transform: scaleX(0); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes lift { from { opacity: 0; transform: translateY(10px); } }
    .status-n { transform-box: view-box; transform-origin: 36px 335px; }
    @media (max-width: 560px) {
      .caps { font-size: 30px; letter-spacing: 1px; }
      .status-n { transform: scale(1.9); }
    }

  </style>
  <defs>
    <clipPath id="card"><rect width="880" height="460" rx="6"/></clipPath>
    <clipPath id="name"><rect x="0" y="80" width="880" height="222"/></clipPath>
    <clipPath id="slot"><rect x="52" y="315" width="808" height="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="460" fill="#F2F2F0"/>

    <g class="fade" style="animation-delay:0.05s">
      <text class="caps" x="36" y="50" font-size="13" letter-spacing="0.6">Software Engineer</text>
      <text class="caps" x="844" y="50" font-size="13" letter-spacing="0.6" text-anchor="end">Bangkok</text>
    </g>
    <line class="rule draw from-left" x1="36" y1="72.5" x2="844" y2="72.5" style="animation-delay:0.10s"/>

    <g clip-path="url(#name)">
      <text class="disp rise" x="28.0" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.150s">J</text>
      <text class="disp rise" x="87.4" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.195s">o</text>
      <text class="disp rise" x="183.3" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.240s">s</text>
      <text class="disp rise" x="251.0" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.285s">h</text>
      <text class="disp rise" x="385.9" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.330s">P</text>
      <text class="disp rise" x="488.8" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.375s">e</text>
      <text class="disp rise" x="571.5" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.420s">r</text>
      <text class="disp rise" x="631.8" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.465s">r</text>
      <text class="disp rise" x="692.0" y="262" font-size="178" style="fill:#1D1D1B;animation-delay:0.510s">y</text>
    </g>

    <g class="status-n">
      <g class="lift" style="animation-delay:0.90s">
        <circle class="pulse" cx="41" cy="335" r="4.5" fill="#1D1D1B"/>
        <g clip-path="url(#slot)"><g class="odo">
          <text class="body" x="58" y="342" font-size="21" style="fill:#1D1D1B"><tspan style="fill:#8A8A88">Now — </tspan>helping shops see their real profit</text>
          <text class="body" x="58" y="382" font-size="21" style="fill:#1D1D1B"><tspan style="fill:#8A8A88">Side quest — </tspan>making search less painful</text>
          <text class="body" x="58" y="422" font-size="21" style="fill:#1D1D1B"><tspan style="fill:#8A8A88">Off the clock — </tspan>writing music</text>
          <text class="body" x="58" y="462" font-size="21" style="fill:#1D1D1B"><tspan style="fill:#8A8A88">Always — </tspan>trusting the process</text>
          <text class="body" x="58" y="502" font-size="21" style="fill:#1D1D1B"><tspan style="fill:#8A8A88">Now — </tspan>helping shops see their real profit</text>
        </g></g>
      </g>
    </g>

    <line class="rule draw from-left" x1="0" y1="386.5" x2="880" y2="386.5" style="animation-delay:0.60s"/>
    <g class="fade" style="animation-delay:1.10s">
      <text class="caps ticker" x="36" y="430" font-size="13" letter-spacing="1.2">Go   /   TypeScript   /   React   /   Next.js   /   TanStack   /   PostgreSQL   /   Redis   /   GCP   /   Docker   /   Go   /   TypeScript   /   React   /   Next.js   /   TanStack   /   PostgreSQL   /   Redis   /   GCP   /   Docker   /   </text>
    </g>
  </g>
</svg>
