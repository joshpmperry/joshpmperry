  <title id="t">About Josh Perry</title>
  <desc id="d">About: Full-stack developer. I like systems that scale and hold up under pressure, and I sweat the details, from the database schema to the last bit of motion. British and Thai, based in Bangkok. Once played ice hockey for Thailand’s U20 squad, which still surprises people. These days I write music and take apart things that were working fine. Now: Software engineer at Balerion, building the systems that keep businesses moving. Side quest: an e-commerce tool that shows shops their real profit, and how to grow it safely. Usually built with: Go, TypeScript, React, Next.js, TanStack, PostgreSQL, Redis, GCP, Docker.</desc>
  <style>
    @font-face { font-family: 'JP Sans'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JP Sans Light'; src: url(data:font/woff2;base64,) format('woff2'); }
    
    .disp { font-family: 'JP Display', serif; fill: #F2F2F0; }
    .caps { font-family: 'JP Sans', sans-serif; fill: #8A8A88; text-transform: uppercase; }
    .body { font-family: 'JP Sans Light', sans-serif; fill: #F2F2F0; }
    .grey { fill: #8A8A88; }
    .rule { stroke: #8A8A88; stroke-opacity: 0.45; stroke-width: 1; }
    .from-left { transform-box: fill-box; transform-origin: left center; }
    .bx { transform-box: fill-box; transform-origin: center; }

    /* Each keyframe names only its starting point: the resting state is the plain, visible one,
       so a renderer that skips CSS animation still shows everything in place. */
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation: rise 1s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .draw { animation: draw 1.1s cubic-bezier(0.77, 0, 0.175, 1) both; }
      .fade { animation: fade 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .lift { animation: lift 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .rise { transform-box: fill-box; }
      /* Constant motion is linear; the pulse is a slow breath, not a blink. */
      .pulse { animation: pulse 2.4s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
      .odo { animation: odo 13s cubic-bezier(0.77, 0, 0.175, 1) 2.2s infinite; }
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    /* Odometer: hold each phrase, then a short eased step up to the next. The last row repeats
       the first, so the jump back to 0 is invisible. At rest it shows the first phrase. */
    @keyframes odo {
      0%, 21% { transform: translateY(0); }
      25%, 46% { transform: translateY(-40px); }
      50%, 71% { transform: translateY(-80px); }
      75%, 96% { transform: translateY(-120px); }
      100% { transform: translateY(-160px); }
    }
    @keyframes rise { from { transform: translateY(105%); } }
    @keyframes draw { from { transform: scaleX(0); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes lift { from { opacity: 0; transform: translateY(10px); } }

  </style>
