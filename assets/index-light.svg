<svg xmlns="http://www.w3.org/2000/svg" width="880" height="546" viewBox="0 0 880 546" role="img" aria-labelledby="t d">
  <!-- Fonts: Newsreader (c) 2020 The Newsreader Project Authors; Hanken Grotesk (c) 2021 The Hanken Grotesk Project Authors. Subsets embedded under the SIL Open Font License 1.1. -->
  <title id="t">About Josh Perry</title>
  <desc id="d">About: I build software that solves real problems, with an eye for the details people feel: clean interfaces and motion that's there on purpose. British and Thai. Off the clock: music, ice hockey, taking things apart. Now: Building the next e-commerce optimization platform. See your real profit. Grow it safely. On the side: something to make the web easier to search. Stack: Go, TypeScript, React, Next.js, PostgreSQL, Redis, GCP, Docker.</desc>
  <style>
    @font-face { font-family: 'JP Sans'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JP Sans Light'; src: url(data:font/woff2;base64,) format('woff2'); }
    
    .disp { font-family: 'JP Display', serif; fill: #1D1D1B; }
    .caps { font-family: 'JP Sans', sans-serif; fill: #8E8E8C; text-transform: uppercase; }
    .body { font-family: 'JP Sans Light', sans-serif; fill: #1D1D1B; }
    .grey { fill: #8E8E8C; }
    .rule { stroke: #8E8E8C; stroke-opacity: 0.45; stroke-width: 1; }
    .from-left { transform-box: fill-box; transform-origin: left center; }

    /* Each keyframe names only its starting point: the resting state is the plain, visible one,
       so a renderer that skips CSS animation still shows everything in place. */
    @media (prefers-reduced-motion: no-preference) {
      .rise { animation: rise 1s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .draw { animation: draw 1.1s cubic-bezier(0.77, 0, 0.175, 1) both; }
      .fade { animation: fade 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
      .lift { animation: lift 0.8s cubic-bezier(0.23, 1, 0.32, 1) both; }
    }
    @keyframes rise { from { transform: translateY(105%); } }
    @keyframes draw { from { transform: scaleX(0); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes lift { from { opacity: 0; transform: translateY(10px); } }

  </style>
  <line class="rule draw from-left" x1="0" y1="0.5" x2="880" y2="0.5" style="animation-delay:0.05s"/>
  <g class="lift" style="animation-delay:0.20s">
    <text class="caps" x="0" y="44.5" font-size="13" letter-spacing="0.4">About</text>
    <text class="body" x="300" y="44.5" font-size="22">I build software that solves real problems, with an eye for</text>
    <text class="body" x="300" y="78.5" font-size="22">the details people feel: clean interfaces and motion that's</text>
    <text class="body" x="300" y="112.5" font-size="22">there on purpose.</text>
    <text class="body grey" x="300" y="160.5" font-size="22">British and Thai. Off the clock: music, ice hockey, taking</text>
    <text class="body grey" x="300" y="194.5" font-size="22">things apart.</text>
  </g>
  <line class="rule draw from-left" x1="0" y1="238.5" x2="880" y2="238.5" style="animation-delay:0.13s"/>
  <g class="lift" style="animation-delay:0.28s">
    <text class="caps" x="0" y="282.5" font-size="13" letter-spacing="0.4">Now</text>
    <text class="body" x="300" y="282.5" font-size="22">Building the next e-commerce optimization platform.</text>
    <text class="body grey" x="300" y="330.5" font-size="22">See your real profit. Grow it safely.</text>
    <text class="body" x="300" y="378.5" font-size="22">On the side: something to make the web easier to search.</text>
  </g>
  <line class="rule draw from-left" x1="0" y1="422.5" x2="880" y2="422.5" style="animation-delay:0.21s"/>
  <g class="lift" style="animation-delay:0.36s">
    <text class="caps" x="0" y="466.5" font-size="13" letter-spacing="0.4">Stack</text>
    <text class="body" x="300" y="466.5" font-size="22">Go, TypeScript, React, Next.js, PostgreSQL, Redis,</text>
    <text class="body" x="300" y="500.5" font-size="22">GCP, Docker.</text>
  </g>
  <line class="rule draw from-left" x1="0" y1="544.5" x2="880" y2="544.5" style="animation-delay:0.29s"/>
</svg>
